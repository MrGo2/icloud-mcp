name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # macOS runner: mode.js hard-blocks LOCAL mode on other platforms, and the
    # suites exercise mode switching. Free for public repos.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      # Pinned to pnpm 10: pnpm 11 requires Node >= 22.13, which would break
      # the Node 20 leg of the matrix. Lockfile v9.0 is shared by both majors.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  inspector:
    # Independent check that the server speaks MCP: the official inspector
    # drives a real stdio session and lists the tools.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Inspector smoke (tools/list)
        run: pnpm dlx @modelcontextprotocol/inspector --cli node index.js --method tools/list
