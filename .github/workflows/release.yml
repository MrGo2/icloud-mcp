name: Release

# Tag push v* → test → npm STAGE publish (OIDC trusted publishing, provenance)
# → human approves on npmjs.com with 2FA → MCP Registry publish (github-oidc)
# → mcpb pack → GitHub release with the .mcpb attached. No npm token anywhere:
# npmjs.com trusts this exact repo + workflow filename via OIDC.

on:
  push:
    tags: ['v*']

jobs:
  test:
    # macOS: mode.js hard-blocks LOCAL mode elsewhere and the suites exercise
    # mode switching (same reason as ci.yml).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for npm trusted publishing and mcp-publisher
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      # Node 24 bundles npm >= 11.5.1, the minimum for OIDC trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches versions
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          for f in package.json manifest.json; do
            V=$(jq -r .version "$f")
            [ "$V" = "$TAG_VERSION" ] || { echo "$f says $V, tag says $TAG_VERSION"; exit 1; }
          done
          for q in .version '.packages[0].version'; do
            V=$(jq -r "$q" server.json)
            [ "$V" = "$TAG_VERSION" ] || { echo "server.json $q says $V, tag says $TAG_VERSION"; exit 1; }
          done

      # package.json declares contentPolicy.class "dual-use", and npm refuses
      # direct OIDC publishing of dual-use packages (403). So CI only STAGES
      # the version; a maintainer approves it with 2FA on npmjs.com
      # (Staged Packages tab) or `npm stage approve <id>`. Needs npm >= 11.15.
      - name: Upgrade npm (stage publish)
        run: npm install -g npm@11.21.1 && npm --version

      # Skip if the version is already on npm, so a failed later step can be
      # re-run without dying on EPUBLISHCONFLICT.
      - name: Stage on npm
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if npm view "mcp-icloud@$TAG_VERSION" version >/dev/null 2>&1; then
            echo "mcp-icloud@$TAG_VERSION already on npm, skipping stage"
          else
            npm stage publish --provenance
            echo "::notice::mcp-icloud@$TAG_VERSION staged. Approve it on npmjs.com > mcp-icloud > Staged Packages (2FA)."
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    # Polls until the staged version is approved. If approval comes after the
    # timeout, re-run this job alone: `gh run rerun <run-id> --failed`.
    timeout-minutes: 350
    permissions:
      id-token: write   # OIDC for mcp-publisher
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Waits for the human approval of the staged version, then for npm's
      # post-publish scan; the MCP Registry validates against npm.
      - name: Wait for npm approval and visibility
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          until npm view "mcp-icloud@$TAG_VERSION" version >/dev/null 2>&1; do
            sleep 30
          done

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Build .mcpb bundle
        run: |
          npm install --omit=dev --ignore-scripts
          npm install -g @anthropic-ai/mcpb
          mcpb pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" icloud-mcp.mcpb \
            --title "${GITHUB_REF#refs/tags/}" --generate-notes
