name: Feature request
description: A tool or capability you'd like to see
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like the server to do?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode matters to you?
      options:
        - LOCAL (AppleScript)
        - CLOUD (iCloud protocols)
        - Both
  - type: textarea
    id: context
    attributes:
      label: What are you building / automating?
      description: Optional, but helps prioritize.
