<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="icloud-mcp: Apple services for your AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" font-size="58" font-weight="700" fill="#1f2328">icloud-mcp</text>
    <rect x="82" y="148" width="330" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="192" font-size="21" fill="#57606a">Mail · Calendar · Contacts · Reminders · Notes · Messages · Safari</text>
    <text x="80" y="226" font-size="17" fill="#6e7781">One MCP server, two modes: AppleScript on your Mac, or iCloud from anywhere</text>
    <g font-size="34" text-anchor="middle">
      <g transform="translate(795,90)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">✉️</text>
      </g>
      <g transform="translate(875,90)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">📅</text>
      </g>
      <g transform="translate(955,90)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">👥</text>
      </g>
      <g transform="translate(1035,90)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">☑️</text>
      </g>
      <g transform="translate(835,170)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">📝</text>
      </g>
      <g transform="translate(915,170)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">💬</text>
      </g>
      <g transform="translate(995,170)">
        <rect x="-31" y="-31" width="62" height="62" rx="15" fill="#ffffff" stroke="#d0d7de"/>
        <text y="12">🧭</text>
      </g>
    </g>
    <text x="795" y="252" font-size="15" fill="#6e7781">41 tools · MCP SDK v2 · macOS + anywhere</text>
  </g>
</svg>
